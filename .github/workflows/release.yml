name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Definir versão
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        shell: bash
        run: mvn -B clean package

      - name: Preparar entrada do jpackage
        shell: bash
        run: |
          mkdir build-input dist
          cp target/kinship.jar build-input/

      - name: Gerar .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot binutils
          jpackage --type deb --name Kinship \
            --input build-input --main-jar kinship.jar \
            --main-class com.mycompany.kinship.Kinship \
            --icon packaging/kinship.png \
            --app-version "$APP_VERSION" \
            --linux-shortcut --dest dist

      - name: Instalar WiX (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install wixtoolset -y

      - name: Gerar .exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage --type exe --name Kinship \
            --input build-input --main-jar kinship.jar \
            --main-class com.mycompany.kinship.Kinship \
            --icon packaging/kinship.ico \
            --app-version "$APP_VERSION" \
            --win-menu --win-shortcut --win-dir-chooser --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: kinship-${{ runner.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*